name: build

# Builds the tap.python package on macOS and Windows.
# The embedded Python runtime is installed by scripts/install-runtime.*
# before configuring, since the externals link against it.
#
# The host-independent core (core/) is also built and tested on Linux against
# CPython 3.13, plain and under sanitizers — no Max, min-api or runtime install.
# The external and its mock-kernel unit test build on Linux too (Max does not
# run there, but the glue does), embedding the same CPython 3.13.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository. Third-party actions are pinned by
# commit SHA (the tag each SHA was cut from is noted beside it).
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: linux-core (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            sanitize: ""
          - name: asan-ubsan
            build_type: Debug
            sanitize: "address,undefined"
          - name: tsan
            build_type: Debug
            sanitize: "thread"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the examples' dependencies into the embedded interpreter's prefix
        run: 'python -m pip install --require-hashes --only-binary :all: -r scripts/requirements.lock'

      # The sanitizer runtimes cannot map their shadow memory with the runner
      # kernel's default ASLR entropy ("unexpected memory mapping").
      - name: Reduce ASLR entropy for the sanitizers
        if: matrix.sanitize != ''
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S core -B build-core
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPython3_EXECUTABLE="$(which python)"
          -DTAP_PYTHON_SANITIZE="${{ matrix.sanitize }}"

      - name: Build
        run: cmake --build build-core --parallel

      - name: Test
        env:
          TAP_PYTHON_TEST_REQUIRE_EXAMPLES: "1"
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-core --output-on-failure --parallel 4

  linux-max-glue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the examples' dependencies into the embedded interpreter's prefix
        run: 'python -m pip install --require-hashes --only-binary :all: -r scripts/requirements.lock'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # The runtime is exactly what the lock files pin, so it is cached on them (and on
      # the installer itself); any change to either reinstalls it.
      - name: Cache the Python runtime
        id: runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: support
          key: runtime-macos-universal-${{ hashFiles('scripts/runtime.lock', 'scripts/requirements.lock', 'scripts/install-runtime.sh') }}

      - name: Install Python runtime (universal libpython for linking)
        if: steps.runtime.outputs.cache-hit != 'true'
        run: ./scripts/install-runtime.sh --universal

      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify externals are universal
        run: |
          set -e
          ls -la externals
          for mxo in externals/*.mxo; do
            bin="$mxo/Contents/MacOS/$(basename "$mxo" .mxo)"
            echo "== $mxo =="
            lipo -info "$bin"
            lipo -info "$bin" | grep -q "arm64" && lipo -info "$bin" | grep -q "x86_64" \
              || { echo "ERROR: $bin is not universal"; exit 1; }
          done

      - name: Verify libpython resolves via a relative rpath only
        run: |
          bin="externals/tap.python~.mxo/Contents/MacOS/tap.python~"
          otool -L "$bin"
          otool -L "$bin" | grep -q "@rpath/libpython" \
            || { echo "ERROR: libpython is not linked via @rpath"; exit 1; }
          rpaths=$(otool -l "$bin" | awk '/cmd LC_RPATH/ { getline; getline; print $2 }')
          echo "rpaths: $rpaths"
          echo "$rpaths" | grep -q "^@loader_path/" \
            || { echo "ERROR: the @loader_path rpath to support/lib is missing"; exit 1; }
          if echo "$rpaths" | grep -q "^/"; then
            echo "ERROR: an absolute build-machine path is embedded as an rpath"; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tap-python-macos
          path: externals/*.mxo

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Cache the Python runtime
        id: runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: support
          key: runtime-windows-${{ hashFiles('scripts/runtime.lock', 'scripts/requirements.lock', 'scripts/install-runtime.ps1') }}

      - name: Install Python runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        run: powershell -ExecutionPolicy Bypass -File scripts\install-runtime.ps1

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          $env:PATH = "$PWD\support;$env:PATH"   # so the test binary finds python3xx.dll
          ctest --test-dir build --output-on-failure -C Release

      - name: List externals
        run: dir externals

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tap-python-windows
          path: externals/*.mxe64
